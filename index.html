<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Kitu - Servicios Profesionales</title>
    <meta name="description" content="Encuentra profesionales de mantenimiento a domicilio de forma instantánea.">

    <!-- PWA - Android -->
    <meta name="theme-color" content="#000000">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="manifest.json">

    <!-- PWA - iOS (iPhone/iPad) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Kitu">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">

    <!-- Splash screens iOS -->
    <meta name="apple-touch-fullscreen" content="yes">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

    <!-- App Styles -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <div id="app" class="app-container">
        <!-- Fake iOS Status Bar (PC only) -->
        <div class="status-bar" id="status-bar">
            <span class="status-bar-left" id="status-time">9:41</span>
            <span class="status-bar-right">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/></svg>
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
            </span>
        </div>

        <header id="app-header" class="app-header" style="display:none;"></header>

        <main id="view-container" class="view-content">
            <div class="loading-screen">
                <svg viewBox="0 0 100 100" class="logo-k large spinning">
                    <path d="M30 20 L30 80 M30 50 L70 20 M30 50 L70 80" stroke="currentColor" stroke-width="8" stroke-linecap="round" fill="none" />
                </svg>
                <p>Cargando...</p>
            </div>
        </main>

        <nav id="app-nav" class="app-nav" style="display:none;"></nav>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- App Integration -->
    <script>
        // Si abres el archivo directamente (file://), los módulos ES están bloqueados
        // por el navegador. Usamos un bundle standalone que no necesita módulos.
        if (window.location.protocol === 'file:') {
            var s = document.createElement('script');
            s.src = 'standalone-app.js';
            document.body.appendChild(s);
        } else {
            var m = document.createElement('script');
            m.type = 'module';
            m.textContent = "import('./store.js').then(m => { window.store = m.store; }).catch(e => { console.error('Error loading store:', e); }).finally(() => { const script = document.createElement('script'); script.src = 'app.js'; document.body.appendChild(script); });";
            document.body.appendChild(m);
        }
    </script>
</body>
</html>
